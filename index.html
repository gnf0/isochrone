<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Gallery</title>
    <style>
      body{
        margin:0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        height:100vh;
        display:flex;
        flex-direction:column;
        background:#f6f7fb;
      }
      .bar{
        padding:10px 14px;
        display:flex;
        align-items:center;
        gap:10px;
        background:#f6f7fb;
        border-bottom:1px solid #e6e8ef;
      }
      .title{
        font-weight:650;
        color:#111827;
        white-space:nowrap;
        margin-right:6px;
      }
      .controls{
        display:flex;
        align-items:center;
        gap:10px;
        width:100%;
      }
      select{
        flex:1;
        height:40px;
        padding:0 12px;
        border:1px solid #d7dbe6;
        border-radius:10px;
        background:white;
        font-size:14px;
        outline:none;
      }
      iframe{
        width:100%;
        flex:1;
        min-height:0;
        border:0;
        display:block;
        background:white;
      }
    </style>
  </head>

  <body>
    <div class="bar">
      <div class="title">Map Gallery</div>
      <div class="controls">
        <select id="mapSelect" aria-label="Select map"></select>
      </div>
    </div>

    <iframe id="frame" src="" title="Selected map"></iframe>

    <script>
      const MAP_URLS = ['html/Houston, TX_dist350_res5_dark.html', 'html/Houston, TX_dist500_res5_dark.html', 'html/Los Angeles, CA_dist350_res5_dark.html', 'html/Los Angeles, CA_dist500_res5_dark.html', 'html/Los Angeles, CA_dist500_res5_light_osm.html', 'html/Los Angeles, CA_dist500_res6_light_osm.html', 'html/New York, NY_dist350_res5_dark.html', 'html/New York, NY_dist500_res5_dark.html', 'html/Portland, OR_dist100_res6_dark.html', 'html/Savannah, GA_dist350_res5_dark.html', 'html/Savannah, GA_dist350_res6_light_osm.html', 'html/Savannah, GA_dist500_res5_dark.html', 'html/cell_resolutions.html', 'html/road_snapped_points_res4.html', 'html/road_snapped_points_res5.html'];
      const MAP_LABELS = ['Houston, TX dist350 res5 dark', 'Houston, TX dist500 res5 dark', 'Los Angeles, CA dist350 res5 dark', 'Los Angeles, CA dist500 res5 dark', 'Los Angeles, CA dist500 res5 light osm', 'Los Angeles, CA dist500 res6 light osm', 'New York, NY dist350 res5 dark', 'New York, NY dist500 res5 dark', 'Portland, OR dist100 res6 dark', 'Savannah, GA dist350 res5 dark', 'Savannah, GA dist350 res6 light osm', 'Savannah, GA dist500 res5 dark', 'cell resolutions', 'road snapped points res4', 'road snapped points res5'];

      const selectEl = document.getElementById("mapSelect");
      const frameEl = document.getElementById("frame");

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function init() {
        // Build dropdown options
        for (let i = 0; i < MAP_URLS.length; i++) {
          const url = MAP_URLS[i];
          const label = MAP_LABELS[i] ?? url;

          const opt = document.createElement("option");
          opt.value = url;
          opt.textContent = label;
          selectEl.appendChild(opt);
        }

        if (MAP_URLS.length) {
          frameEl.src = MAP_URLS[0];
          selectEl.value = MAP_URLS[0];
        }

        selectEl.addEventListener("change", () => {
          frameEl.src = selectEl.value;
        });
      }

      init();
    </script>
  </body>
</html>
