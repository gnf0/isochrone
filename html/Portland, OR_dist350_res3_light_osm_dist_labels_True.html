        .pulse-marker {

            width: 14px;

        /* static outer ring */
        .pulse-marker::before {
            content: "";
            position: absolute;
            left: -8.0px;
            top: -8.0px;
            width: 30px;
            height: 30px;
            border: 1.5px solid orange;
            border-radius: 50%;
            box-sizing: border-box;
        }

        /* animated pulse */
        .pulse-marker::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255,165,0,0.95);
            transform-origin: center;
            animation: pulse 1.5s infinite;
        }

        /* center dot */
        .pulse-center {
            position: absolute;
            inset: 0;
            background: orange;
            border-radius: 50%;
            z-index: 2;
        }

            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            }
        }
