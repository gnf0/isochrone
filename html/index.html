<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Gallery</title>
    <style>
      body{
        margin:0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        height:100vh;
        display:flex;
        flex-direction:column;
        background:#f6f7fb;
      }
      .bar{
        padding:12px 14px;
        display:flex;
        align-items:center;
        gap:12px;
        background:#f6f7fb;
        border-bottom:1px solid #e6e8ef;
      }
      .title{
        font-weight:650;
        color:#111827;
        white-space:nowrap;
      }
      .search{
        flex:1;
        height:40px;
        padding:0 12px;
        border:1px solid #d7dbe6;
        border-radius:10px;
        background:white;
        font-size:14px;
        outline:none;
      }
      #main{
        flex:1;
        min-height:0;
        display:grid;
        grid-template-columns: 320px 1fr;
      }
      .sidebar{
        overflow:auto;
        padding:12px;
      }
      .list{
        display:grid;
        gap:10px;
      }
      .card{
        text-align:left;
        border:1px solid #e5e7eb;
        background:#fff;
        border-radius:12px;
        padding:12px;
        cursor:pointer;
      }
      .card:hover{
        border-color:#cfd6e6;
        box-shadow: 0 1px 10px rgba(17,24,39,0.06);
      }
      .cardTitle{
        font-weight:650;
        color:#111827;
        font-size:14px;
        margin-bottom:4px;
      }
      .cardFile{
        color:#6b7280;
        font-size:12px;
        word-break:break-word;
      }
      .frameWrap{
        min-width:0;
        flex:1;
      }
      iframe{
        width:100%;
        height:100%;
        border:0;
        display:block;
        background:white;
      }
      /* Responsive: stack on small screens */
      @media (max-width: 900px){
        #main{ grid-template-columns: 1fr; }
        .frameWrap{ height: 60vh; }
      }
    </style>
  </head>

  <body>
    <div class="bar">
      <div class="title">Map Gallery</div>
      <input id="filter" class="search" type="search" placeholder="Filter maps..." />
    </div>

    <div id="main">
      <div class="sidebar">
        <div id="list" class="list"></div>
      </div>
      <div class="frameWrap">
        <iframe id="frame" src="" title="Selected map"></iframe>
      </div>
    </div>

    <script>
      const MAP_FILES = ['Houston, TX_dist350_res5_dark.html', 'Houston, TX_dist500_res5_dark.html', 'Los Angeles, CA_dist350_res5_dark.html', 'Los Angeles, CA_dist500_res5_dark.html', 'Los Angeles, CA_dist500_res5_light_osm.html', 'Los Angeles, CA_dist500_res6_light_osm.html', 'New York, NY_dist350_res5_dark.html', 'New York, NY_dist500_res5_dark.html', 'Portland, OR_dist100_res6_dark.html', 'Savannah, GA_dist350_res5_dark.html', 'Savannah, GA_dist500_res5_dark.html'];

      const listEl = document.getElementById("list");
      const filterEl = document.getElementById("filter");
      const frameEl = document.getElementById("frame");

      function labelFromFile(fname) {
        return fname.replace(/\.html$/, "").replace(/_/g, " ");
      }

      function render(items) {
        listEl.innerHTML = "";
        for (const f of items) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "card";

          btn.innerHTML = `
            <div class="cardTitle">${labelFromFile(f).replaceAll("<","&lt;").replaceAll(">","&gt;")}</div>
            <div class="cardFile">${f.replaceAll("<","&lt;").replaceAll(">","&gt;")}</div>
          `;

          btn.addEventListener("click", () => {
            frameEl.src = f;
          });
          listEl.appendChild(btn);
        }
      }

      const all = MAP_FILES.slice();

      render(all);
      if (all.length) frameEl.src = all[0];

      filterEl.addEventListener("input", () => {
        const q = filterEl.value.trim().toLowerCase();
        const filtered = all.filter(f => f.toLowerCase().includes(q));
        render(filtered);
        if (filtered.length) frameEl.src = filtered[0];
      });
    </script>
  </body>
</html>
